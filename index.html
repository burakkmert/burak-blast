<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0e0c26" />
    <title>BurakBlast</title>
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <i class="blob blob-1"></i>
      <i class="blob blob-2"></i>
      <i class="blob blob-3"></i>
    </div>

    <div id="app">
      <header class="topbar">
        <button
          id="menu-btn"
          class="icon-btn menu-btn"
          type="button"
          data-aria-label="menu.title"
          aria-expanded="false"
        >
          <svg
            class="burger"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <line class="l1" x1="4" y1="6" x2="20" y2="6" />
            <line class="l2" x1="4" y1="12" x2="20" y2="12" />
            <line class="l3" x1="4" y1="18" x2="20" y2="18" />
          </svg>
        </button>
        <div class="logo">Burak<b>Blast</b></div>
        <div class="best" data-title="topbar.best">
          <svg class="crown" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 11H5L3 7zm2.6 13h12.8v2H5.6v-2z" />
          </svg>
          <span id="best">0</span>
        </div>
        <div class="score">
          <span class="score-label" data-text="topbar.score"></span>
          <span id="score" class="score-value">0</span>
        </div>
      </header>
      <main class="game">
        <div id="board" class="board"></div>
        <div id="tray" class="tray"></div>
      </main>
    </div>

    <div id="menu-backdrop" class="backdrop"></div>
    <aside id="menu" class="drawer" data-aria-label="menu.title">
      <div class="drawer-head">
        <b data-text="menu.title"></b>
        <button id="menu-close" class="icon-btn" type="button" data-aria-label="menu.close">
          <svg
            class="burger is-open"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <line class="l1" x1="4" y1="6" x2="20" y2="6" />
            <line class="l2" x1="4" y1="12" x2="20" y2="12" />
            <line class="l3" x1="4" y1="18" x2="20" y2="18" />
          </svg>
        </button>
      </div>
      <nav class="menu-list">
        <button class="menu-item" type="button" data-action="resume" data-text="menu.resume"></button>
        <button class="menu-item" type="button" data-action="newgame" data-text="menu.newGame"></button>
        <button class="menu-item" type="button" data-action="blocks" data-text="menu.blocks"></button>
        <button class="menu-item" type="button" data-action="appearance" data-text="menu.appearance"></button>
        <button class="menu-item" type="button" data-action="settings" data-text="menu.settings"></button>
        <button class="menu-item" type="button" data-action="howto" data-text="menu.howTo"></button>
        <button class="menu-item" type="button" data-action="about" data-text="menu.about"></button>
      </nav>
      <div id="menu-version" class="drawer-foot"></div>
    </aside>

    <div id="screens"></div>
    <div id="dialog" class="overlay" hidden></div>

    <div id="gameover" class="overlay" hidden>
      <div class="panel">
        <h2 data-text="gameOver.title"></h2>
        <div class="panel-label" data-text="gameOver.score"></div>
        <div class="panel-score" id="go-score">0</div>
        <div class="record" id="go-record" data-text="gameOver.newRecord" hidden></div>
        <div class="panel-best"><span data-text="gameOver.best"></span> <span id="go-best">0</span></div>
        <button id="restart" class="btn btn-big" type="button" data-text="gameOver.playAgain"></button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
